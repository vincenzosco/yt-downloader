<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title">ytd. — YouTube downloader</title>
<meta name="description" content="Paste a YouTube link (video or playlist): preview title & cover, download audio/video with yt-dlp.">
<link rel="icon" href="data:,">
<script>window.YTD_VERSION = "081ee6c";</script>
<link rel="stylesheet" href="style.css?v=081ee6c">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <button type="button" class="lang-toggle" id="lang-toggle" aria-label="Switch language">EN</button>
    <h1 class="wordmark">ytd<span class="dot">.</span></h1>
    <p class="tagline" data-i18n="tagline">YouTube downloader — paste a link (video or playlist)</p>
  </div>
</header>

<main class="wrap">

  <section id="panel-link" class="panel">
    <form id="link-form" class="form" autocomplete="off">
      <input id="link-input" type="text" data-i18n-placeholder="placeholder-link" aria-label="YouTube link">
      <button type="submit" class="btn btn-primary" data-i18n="btn-preview">Preview</button>
    </form>
    <p class="status" id="link-status" hidden></p>
    <div id="link-preview"></div>
    <ol class="results" id="link-tracks"></ol>
  </section>

  <noscript>
    <p class="status" data-i18n="noscript">This page requires JavaScript (ES5, works in any browser from ~2015).</p>
  </noscript>

</main>

<div class="sel-tray" id="sel-tray" hidden aria-live="polite">
  <div class="wrap sel-inner">
    <span class="sel-count" id="sel-count"></span>
    <button type="button" class="btn btn-primary" id="sel-zip" data-i18n="zip-download">Download .zip</button>
    <button type="button" class="btn" id="sel-clear" data-i18n="zip-clear">Clear</button>
    <span class="sel-status" id="sel-status"></span>
  </div>
  <div class="wrap">
    <div class="progress" id="sel-progress" hidden>
      <div class="progress-bar" id="sel-progress-bar"></div>
    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="wrap">
    <p class="foot-line"><span data-i18n="engine-label">engine:</span> <span class="mono" id="engine-status"></span></p>
    <p class="foot-line"><a href="https://github.com/vincenzosco/yt-downloader" target="_blank" rel="noopener">github.com/vincenzosco/yt-downloader</a>
      — <span data-i18n="disclaimer">only for content you have rights to.</span>
      — <span class="mono" id="ft-version"></span></p>
  </div>
</footer>

<script src="app.js?v=081ee6c"></script>
</body>
</html>
